name: rafeeq
description: Your Islamic Companion
publish_to: "none"
version: 1.2.23+52

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  shared_preferences: ^2.5.6
  flutter_hooks: ^0.21.4
  hooks_riverpod: ^3.5.0
  equatable: ^3.0.0
  rx_shared_preferences: ^4.0.0
  path_provider: ^2.1.6
  flutter_cache_manager: ^3.5.0
  flutter_animate: ^4.5.2
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  flutter_islamic_icons: ^1.0.2

  path: ^1.9.1
  sqflite: ^2.4.6
  auto_size_text: ^3.0.0
  firebase_core: ^5.2.0
  firebase_analytics: ^13.1.0
  firebase_crashlytics: ^6.1.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  flutter_spinkit: ^5.2.2
  http: ^1.6.0
  flutter_localizations:
    sdk: flutter
  intl:
  flutter_qiblah_advanced: ^4.0.1
  flutter_svg: ^2.5.0
  scrollable_positioned_list: ^0.3.8
  adhan: ^2.0.0+1
  geolocator: ^14.1.2

  confetti: ^0.8.0
  flutter_slidable: ^5.2.0
  cached_network_image: ^4.0.7
  hijri: ^3.0.1

  in_app_update: ^5.0.0
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  app_settings: ^9.0.1
  geocoding: ^5.0.1
  shimmer: ^4.0.0

  dio: ^5.11.1
  flutter_staggered_grid_view: ^0.7.0
  toastification: ^3.2.2
  clock: ^1.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_riverpod: ^3.5.0
  change_app_package_name: ^1.5.0
  flutter_native_splash: ^2.4.8
  golden_toolkit: ^0.15.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.7
  fake_async: ^1.3.3

flutter_native_splash:
  color: "#033736"

  android_12:
    color: "#033736"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/fonts/
    - assets/sounds/
    - assets/other_apps/
    - shorebird.yaml

  fonts:
    - family: PDMS Saleem Quran
      fonts:
        - asset: assets/fonts/PDMSSaleemQuran.ttf
    - family: Jameel Noori Nastaleeq
      fonts:
        - asset: assets/fonts/JameelNooriNastaleeq.ttf
    # QuranWBW's AlQuran Neo v5.x. Not committed: Rafeeq may use it but not
    # share it. See "Getting Started" in README.md for a stand-in.
    - family: IndoPak Nastaleeq
      fonts:
        - asset: assets/fonts/AlQuranNeo5x3-Arabic.ttf
    - family: Surah Names
      fonts:
        - asset: assets/fonts/SurahNameV2.ttf
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
