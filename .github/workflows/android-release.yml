name: Android release build

# Builds the signed Play release of the native app (native/), saves it to
# Google Play as a draft on the production track (with the notes from
# docs/release/<versionName>-whats-new.md), and keeps the AAB, APK and R8
# mapping as an artifact until the draft is saved. Rolling the draft out in
# Play Console stays manual. If the Play upload fails, the artifact is kept.
#
# Runs when a push to main changes versionCode in native/app/build.gradle.kts,
# or by hand from the Actions tab (Run workflow), where the Play upload can be
# turned off to only build.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64   the Play upload keystore, base64
#   RELEASE_STORE_PASSWORD    its store password
#   RELEASE_KEY_ALIAS         the key alias
#   RELEASE_KEY_PASSWORD      the key password
#   GOOGLE_SERVICES_JSON      native/app/src/release/google-services.json
#   PLAY_SERVICE_ACCOUNT_JSON a Google Play service account key (release manager)
#   INDOPAK_FONT_XZ_1 … _4    AlQuranNeo5x3-Arabic.ttf, xz-compressed, base64,
#                             in four parts (a secret holds at most 48 KB). The
#                             font may be used but not shared, so it is never
#                             committed; FONT_SHA256 below checks it.

on:
  push:
    branches: [main]
    paths:
      - 'native/app/build.gradle.kts'
  workflow_dispatch:
    inputs:
      play:
        description: Save the build to Google Play as a draft
        type: boolean
        default: true

permissions:
  contents: read
  actions: write # to delete the artifact once Play has the build

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  FONT_SHA256: 38c5d44cf4058072684e6f60f54c90f5cb9953af2ac2dc1a5a9639eee620cdc9

jobs:
  build:
    name: Build signed AAB and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read the version, and whether it changed
        id: version
        shell: bash
        run: |
          file=native/app/build.gradle.kts
          code=$(grep -oP 'versionCode = \K[0-9]+' "$file")
          name=$(grep -oP 'versionName = "\K[^"]+' "$file")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          build=true
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            before=$(git show HEAD^:"$file" 2>/dev/null | grep -oP 'versionCode = \K[0-9]+' || true)
            [[ "$before" == "$code" ]] && build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if [[ "$build" == true ]]; then
            echo "Building Rafeeq $name ($code)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "versionCode is still $code, so no release build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Java
        if: steps.version.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        if: steps.version.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing, Firebase config and the IndoPak font
        if: steps.version.outputs.build == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FONT_1: ${{ secrets.INDOPAK_FONT_XZ_1 }}
          FONT_2: ${{ secrets.INDOPAK_FONT_XZ_2 }}
          FONT_3: ${{ secrets.INDOPAK_FONT_XZ_3 }}
          FONT_4: ${{ secrets.INDOPAK_FONT_XZ_4 }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD GOOGLE_SERVICES_JSON FONT_1; do
            if [[ -z "${!v}" ]]; then echo "::error::Secret for $v is missing"; exit 1; fi
          done

          # build.gradle.kts reads the signing details from ~/Muzamil/Keystores/rafeeq.txt.
          dir="$HOME/Muzamil/Keystores"
          mkdir -p "$dir"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$dir/rafeeq.keystore"
          {
            echo "storeFile=$dir/rafeeq.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$dir/rafeeq.txt"

          mkdir -p native/app/src/release
          printf '%s' "$GOOGLE_SERVICES_JSON" > native/app/src/release/google-services.json

          printf '%s%s%s%s' "$FONT_1" "$FONT_2" "$FONT_3" "$FONT_4" | base64 --decode | xz --decompress > assets/fonts/AlQuranNeo5x3-Arabic.ttf
          echo "$FONT_SHA256  assets/fonts/AlQuranNeo5x3-Arabic.ttf" | sha256sum --check --quiet

      - name: Build
        if: steps.version.outputs.build == 'true'
        working-directory: native
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Check the release signature
        if: steps.version.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          props="$HOME/Muzamil/Keystores/rafeeq.txt"
          get() { grep -m1 "^$1=" "$props" | cut -d= -f2-; }
          expected=$(keytool -exportcert -keystore "$(get storeFile)" -storepass "$(get storePassword)" -alias "$(get keyAlias)" | sha256sum | cut -d' ' -f1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs native/app/build/outputs/apk/release/app-release.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          if [[ "$expected" != "$actual" ]]; then
            echo "::error::The APK is not signed with the upload key"; exit 1
          fi
          echo "Signed with the upload key." >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the outputs
        if: steps.version.outputs.build == 'true'
        shell: bash
        run: |
          out="rafeeq-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}"
          mkdir -p "dist/$out"
          cp native/app/build/outputs/bundle/release/app-release.aab "dist/$out/$out.aab"
          cp native/app/build/outputs/apk/release/app-release.apk "dist/$out/$out.apk"
          cp native/app/build/outputs/mapping/release/mapping.txt "dist/$out/mapping.txt"
          echo "OUT=$out" >> "$GITHUB_ENV"
          ls -la "dist/$out" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        id: artifact
        if: steps.version.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: dist/${{ env.OUT }}/
          retention-days: 30
          if-no-files-found: error

      - name: Write the Play release notes
        if: steps.version.outputs.build == 'true' && (github.event_name == 'push' || inputs.play)
        shell: bash
        run: |
          notes="docs/release/${{ steps.version.outputs.name }}-whats-new.md"
          mkdir -p dist/whatsnew
          if [[ -f "$notes" ]]; then
            for lang in en-US ur; do
              sed -n "/^<$lang>\$/,/^<\/$lang>\$/p" "$notes" | sed '1d;$d' > "dist/whatsnew/whatsnew-$lang"
              [[ -s "dist/whatsnew/whatsnew-$lang" ]] || rm "dist/whatsnew/whatsnew-$lang"
            done
          fi
          if ls dist/whatsnew/* >/dev/null 2>&1; then
            echo "Release notes from $notes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No release notes in $notes; the draft has none."
          fi

      - name: Save to Google Play as a draft
        id: play
        if: steps.version.outputs.build == 'true' && (github.event_name == 'push' || inputs.play)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.satechdev.rafeeqapp
          releaseFiles: dist/${{ env.OUT }}/${{ env.OUT }}.aab
          mappingFile: dist/${{ env.OUT }}/mapping.txt
          whatsNewDirectory: dist/whatsnew
          releaseName: ${{ steps.version.outputs.code }} (${{ steps.version.outputs.name }})
          track: production
          status: draft

      - name: Delete the artifact now that Play has the build
        if: steps.play.outcome == 'success'
        uses: geekyeggo/delete-artifact@v5
        with:
          name: ${{ env.OUT }}

      - name: Summary
        if: steps.play.outcome == 'success'
        run: echo "Saved to Google Play as a production draft. Review and roll it out in Play Console." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing key and font from the runner
        if: always()
        run: rm -rf "$HOME/Muzamil" assets/fonts/AlQuranNeo5x3-Arabic.ttf native/app/src/release/google-services.json
